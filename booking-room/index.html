<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบจองห้องพัก - Room Booking System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body, input, select, button, table { font-family: 'Kanit', sans-serif !important; }
        .room-card { border-radius: 10px; transition: transform 0.2s; }
        .room-card:hover { transform: translateY(-3px); }
    </style>
</head>
<body class="bg-light">

<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="fw-bold text-primary mb-0">ระบบจองห้องพัก (Room Booking System)</h3>
        <button onclick="location.reload()" class="btn btn-outline-danger btn-sm">รีเซ็ตระบบ</button>
    </div>

    <!-- ผังแสดงสถานะห้องพัก -->
    <div class="card shadow-sm border-0 mb-4">
        <div class="card-header bg-white py-3">
            <h5 class="mb-0 fw-bold">1. ผังแสดงสถานะห้องพัก</h5>
        </div>
        <div class="card-body">
            <div class="row g-3" id="roomContainer"></div>
        </div>
    </div>

    <div class="row">
        <!-- ฟอร์มการจอง -->
        <div class="col-lg-5 mb-4">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-primary text-white py-3">
                    <h5 class="mb-0 fw-bold">2. ฟอร์มทำรายการจอง</h5>
                </div>
                <div class="card-body p-4">
                    <form id="bookingForm">
                        <div class="mb-3">
                            <label class="form-label">ชื่อ-นามสกุล ผู้เช่า</label>
                            <input type="text" id="tenantName" class="form-control" required placeholder="สมชาย ใจดี">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">เบอร์โทรศัพท์</label>
                            <input type="tel" id="tenantPhone" class="form-control" required placeholder="0812345678">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">เลือกห้องพัก</label>
                            <select id="roomSelect" class="form-select" required></select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">พนักงานผู้ดูแล</label>
                            <select id="staffSelect" class="form-select" required></select>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 fw-bold py-2">ยืนยันการจอง</button>
                    </form>
                </div>
            </div>
        </div>

        <!-- ตารางสรุปประวัติ -->
        <div class="col-lg-7 mb-4">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-white py-3">
                    <h5 class="mb-0 fw-bold">3. ตารางประวัติและสถานะการจอง</h5>
                </div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th>รหัสจอง</th>
                                    <th>ผู้เช่า</th>
                                    <th>ห้องพัก</th>
                                    <th>ค่าประกัน</th>
                                    <th>ผู้ดูแล</th>
                                    <th>สถานะ</th>
                                </tr>
                            </thead>
                            <tbody id="historyTable">
                                <tr><td colspan="6" class="text-center py-4 text-muted">ยังไม่มีรายการจองในระบบ</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
// ==========================================
// OOP Classes in JavaScript
// ==========================================

class Room {
    constructor(roomNo, roomType, pricePerNight, isAvailable = true) {
        this.roomNo = roomNo;
        this.roomType = roomType;
        this.pricePerNight = pricePerNight;
        this.isAvailable = isAvailable;
    }

    checkAvailability() { return this.isAvailable; }
    setAvailable(status) { this.isAvailable = status; }
    
    getColorClass() {
        if (this.roomType === 'Standard Room') return 'bg-success';
        if (this.roomType === 'Deluxe Room') return 'bg-primary';
        return 'bg-dark';
    }
}

class Staff {
    constructor(staffId, name) {
        this.staffId = staffId;
        this.name = name;
    }
    calculateDeposit(roomPrice) { return roomPrice * 0.50; }
}

class Tenant {
    constructor(tenantId, name, phone) {
        this.tenantId = tenantId;
        this.name = name;
        this.phone = phone;
    }
}

class Booking {
    constructor(bookingId, tenant, room, staff) {
        this.bookingId = bookingId;
        this.tenant = tenant;
        this.room = room;
        this.staff = staff;
        this.depositAmount = 0;
        this.status = 'Pending';
    }

    processBooking() {
        if (!this.room.checkAvailability()) return false;
        this.depositAmount = this.staff.calculateDeposit(this.room.pricePerNight);
        this.room.setAvailable(false);
        this.status = 'Confirmed';
        return true;
    }
}

// ==========================================
// Master Data & App State
// ==========================================

const rooms = [
    new Room('101', 'Standard Room', 1200),
    new Room('102', 'Standard Room', 1200),
    new Room('201', 'Deluxe Room', 2000),
    new Room('202', 'Deluxe Room', 2000),
    new Room('301', 'VIP Suite', 3500)
];

const staffList = [
    new Staff('S01', 'สมชาย (พนักงานต้อนรับ)'),
    new Staff('S02', 'สมหญิง (พนักงานต้อนรับ)')
];

const bookingHistory = [];

// ==========================================
// UI Rendering Functions
// ==========================================

function renderUI() {
    // 1. Render Room Cards
    const container = document.getElementById('roomContainer');
    container.innerHTML = rooms.map(room => `
        <div class="col-6 col-md-3">
            <div class="card room-card border-0 text-white ${room.getColorClass()} shadow-sm">
                <div class="card-body p-3 text-center">
                    <h4 class="fw-bold mb-1">ห้อง ${room.roomNo}</h4>
                    <p class="mb-1 small">${room.roomType}</p>
                    <p class="mb-2 fw-semibold">${room.pricePerNight.toLocaleString()} ฿/คืน</p>
                    <span class="badge ${room.checkAvailability() ? 'bg-light text-success' : 'bg-danger text-white'} fw-bold">
                        ${room.checkAvailability() ? 'ว่าง' : 'ไม่ว่าง'}
                    </span>
                </div>
            </div>
        </div>
    `).join('');

    // 2. Render Dropdown Options
    const roomSelect = document.getElementById('roomSelect');
    roomSelect.innerHTML = '<option value="">-- เลือกห้องพัก --</option>' + 
        rooms.map(r => `<option value="${r.roomNo}" ${!r.checkAvailability() ? 'disabled' : ''}>
            ห้อง ${r.roomNo} - ${r.roomType} (${r.pricePerNight.toLocaleString()} ฿) ${r.checkAvailability() ? '[ว่าง]' : '[ไม่ว่าง]'}
        </option>`).join('');

    const staffSelect = document.getElementById('staffSelect');
    staffSelect.innerHTML = '<option value="">-- เลือกพนักงาน --</option>' + 
        staffList.map((s, idx) => `<option value="${idx}">${s.name}</option>`).join('');
}

// Handle Form Submit
document.getElementById('bookingForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const name = document.getElementById('tenantName').value;
    const phone = document.getElementById('tenantPhone').value;
    const roomNo = document.getElementById('roomSelect').value;
    const staffIdx = document.getElementById('staffSelect').value;

    const selectedRoom = rooms.find(r => r.roomNo === roomNo);
    const selectedStaff = staffList[staffIdx];
    const tenant = new Tenant('T-' + Math.floor(Math.random() * 900 + 100), name, phone);

    const booking = new Booking('BK-' + Date.now().toString().slice(-4), tenant, selectedRoom, selectedStaff);

    if (booking.processBooking()) {
        bookingHistory.unshift(booking);
        renderUI();
        renderHistory();
        e.target.reset();
        alert('ทำรายการจองสำเร็จ!');
    } else {
        alert('ห้องพักไม่ว่าง ไม่สามารถจองได้');
    }
});

function renderHistory() {
    const historyTable = document.getElementById('historyTable');
    if (bookingHistory.length === 0) return;

    historyTable.innerHTML = bookingHistory.map(b => `
        <tr>
            <td><small class="fw-bold">${b.bookingId}</small></td>
            <td><div>${b.tenant.name}</div><small class="text-muted">${b.tenant.phone}</small></td>
            <td><span class="badge bg-secondary">${b.room.roomNo}</span><small class="d-block text-muted">${b.room.roomType}</small></td>
            <td class="text-primary fw-bold">${b.depositAmount.toLocaleString()} ฿</td>
            <td><small>${b.staff.name}</small></td>
            <td><span class="badge bg-success">${b.status}</span></td>
        </tr>
    `).join('');
}

// Initial Call
renderUI();
</script>
</body>
</html>
